services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: diet_agent
      POSTGRES_USER: diet_agent
      POSTGRES_PASSWORD: diet_agent_local
    volumes:
      - diet-agent-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diet_agent -d diet_agent"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://diet_agent:diet_agent_local@postgres:5432/diet_agent
    volumes:
      - .:/app
      - diet-agent-local-node-modules:/app/node_modules
    command: sh -lc "npm ci && npm run db:migrate"

volumes:
  diet-agent-local-postgres-data:
  diet-agent-local-node-modules:
